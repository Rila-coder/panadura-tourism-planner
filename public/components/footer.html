<!-- public/components/footer.html -->
<footer class="bg-[#e7eeff] mt-auto">
    <div class="max-w-7xl mx-auto px-4 md:px-16 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Brand -->
            <div class="md:col-span-1">
                <a class="text-2xl font-bold text-[#003fb1] tracking-tight flex items-center gap-2" href="/">
                    <span class="material-symbols-outlined text-[28px]">map</span>
                    Panadura Planner
                </a>
                <p class="text-sm text-[#434654] mt-2">Discover the best places within 25km of Panadura.</p>
            </div>
            
            <!-- Quick Links -->
            <div>
                <h4 class="font-semibold text-[#111c2d] mb-3">Quick Links</h4>
                <ul class="space-y-2 text-sm">
                    <li><a href="/" class="text-[#434654] hover:text-[#003fb1] transition-colors">Home</a></li>
                    <li><a href="/places" class="text-[#434654] hover:text-[#003fb1] transition-colors">Destinations</a></li>
                    <li><a href="/planner" class="text-[#434654] hover:text-[#003fb1] transition-colors">Trip Planner</a></li>
                    <li><a href="/admin" class="text-[#434654] hover:text-[#003fb1] transition-colors">Admin</a></li>
                </ul>
            </div>
            
            <!-- Categories -->
            <div>
                <h4 class="font-semibold text-[#111c2d] mb-3">Categories</h4>
                <ul id="footer-categories" class="space-y-2 text-sm">
                    <li class="text-[#434654]">Loading...</li>
                </ul>
            </div>
            
            <!-- Contact -->
            <div>
                <h4 class="font-semibold text-[#111c2d] mb-3">Contact</h4>
                <ul class="space-y-2 text-sm text-[#434654]">
                    <li>📧 info@panaduraplanner.com</li>
                    <li>📍 Panadura, Sri Lanka</li>
                </ul>
            </div>
        </div>
        
        <!-- Copyright -->
        <div class="border-t border-[#c3c5d7] mt-6 pt-4 text-center text-sm text-[#434654]">
            <p>© 2024 Panadura Day Planner. All rights reserved.</p>
        </div>
    </div>
</footer>

<!-- Load categories for footer -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/categories')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const container = document.getElementById('footer-categories');
                    container.innerHTML = '';
                    data.data.forEach(cat => {
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="/places?category=${cat.category_id}" class="text-[#434654] hover:text-[#003fb1] transition-colors">${cat.name} (${cat.place_count})</a>`;
                        container.appendChild(li);
                    });
                }
            })
            .catch(() => {
                document.getElementById('footer-categories').innerHTML = '<li class="text-[#434654]">Categories unavailable</li>';
            });
    });
</script>
