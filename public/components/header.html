<!-- public/components/header.html -->
<header class="bg-white/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-white/10 shadow-sm">
    <div class="flex justify-between items-center px-4 md:px-16 max-w-7xl mx-auto h-20">
        <!-- Logo -->
        <a class="text-2xl font-bold text-[#003fb1] tracking-tight flex items-center gap-2" href="/">
            <span class="material-symbols-outlined text-[32px]">map</span>
            Panadura Planner
        </a>
        
        <!-- Navigation -->
        <nav class="hidden md:flex gap-6 items-center">
            <a class="text-[#434654] hover:text-[#003fb1] transition-colors" href="/">Home</a>
            <a class="text-[#434654] hover:text-[#003fb1] transition-colors" href="/places">Destinations</a>
            <a class="text-[#434654] hover:text-[#003fb1] transition-colors" href="/planner">Itineraries</a>
            <a class="text-[#434654] hover:text-[#003fb1] transition-colors" href="/admin">Admin</a>
        </nav>
        
        <!-- Action Button -->
        <a href="/planner" class="bg-[#003fb1] text-white px-4 py-2 rounded-lg hover:bg-[#1a56db] transition-colors hidden md:block">
            Plan Your Trip
        </a>
        
        <!-- Mobile Menu -->
        <button class="md:hidden text-[#434654]">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>
</header>

<!-- Make current page active - Add this script at bottom of each page -->
<script>
    // Highlight current page in navigation
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('nav a');
        links.forEach(link => {
            const linkPath = link.getAttribute('href');
            if (currentPath === linkPath || (currentPath === '/' && linkPath === '/')) {
                link.classList.add('text-[#003fb1]', 'border-b-2', 'border-[#003fb1]', 'pb-1', 'font-semibold');
                link.classList.remove('text-[#434654]');
            }
        });
    });
</script>
