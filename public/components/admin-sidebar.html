<!-- Sidebar Container -->

    <!-- Brand & Mobile Close Button -->
    <div class="px-4 pb-4 border-b border-[#e7eeff] flex items-center justify-between">

            <a href="/admin" class="text-xl font-bold text-[#003fb1] tracking-tight flex items-center gap-2">

        </div>
        <!-- Mobile Close Button -->
        <button id="close-sidebar-btn" onclick="closeSidebar()" class="md:hidden text-[#434654] hover:text-[#003fb1] p-1 rounded-lg">

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <a href="/admin?tab=places" id="sidebar-nav-places" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[#434654] hover:bg-[#e7eeff] hover:text-[#003fb1] transition-colors font-medium text-sm">
            <span class="material-symbols-outlined text-[20px]">place</span>
            <span>Manage Places</span>
        </a>
        <a href="/admin?tab=add" id="sidebar-nav-add" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[#434654] hover:bg-[#e7eeff] hover:text-[#003fb1] transition-colors font-medium text-sm">
            <span class="material-symbols-outlined text-[20px]">add_location</span>
            <span>Add New Place</span>
        </a>
        <a href="/admin?tab=categories" id="sidebar-nav-categories" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[#434654] hover:bg-[#e7eeff] hover:text-[#003fb1] transition-colors font-medium text-sm">
            <span class="material-symbols-outlined text-[20px]">category</span>
            <span>Categories</span>
        </a>
        <a href="/admin?tab=plans" id="sidebar-nav-plans" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-[#434654] hover:bg-[#e7eeff] hover:text-[#003fb1] transition-colors font-medium text-sm">
            <span class="material-symbols-outlined text-[20px]">event_note</span>
            <span>User Plans</span>
        </a>
    </nav>

    <!-- User Profile & Logout -->
    <div class="border-t border-[#e7eeff] px-3 pt-3">
        <div class="flex items-center gap-3 px-3 py-2 bg-[#f9f9ff] rounded-xl mb-2">
            <div class="w-8 h-8 rounded-full bg-[#003fb1] text-white flex items-center justify-center text-sm font-bold shrink-0">
                A
            </div>
            <div class="truncate">
                <p class="text-sm font-semibold text-[#111c2d] truncate">Admin User</p>
                <p class="text-xs text-[#434654] truncate">admin@planner.com</p>
            </div>
        </div>
        <button id="admin-logout" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-red-500 hover:bg-red-50 transition-colors font-medium text-sm">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            <span>Logout</span>
        </button>
    </div>
</aside>

<!-- Admin sidebar JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Highlight current page in sidebar
        const currentPath = window.location.pathname + window.location.search;
        const sidebarLinks = document.querySelectorAll('a');
        sidebarLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href && currentPath.includes(href)) {
                link.classList.add('bg-[#e7eeff]', 'text-[#003fb1]');
                link.classList.remove('text-[#434654]');
            }
        });

        // ✅ FIXED: Logout functionality
        const logoutBtn = document.getElementById('admin-logout');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Clear token from localStorage
                localStorage.removeItem('adminToken');
                // Show toast message if available
                if (typeof showToast === 'function') {
                    showToast('Logged out successfully', 'info');
                }
                // Redirect to login page after short delay
                setTimeout(function() {
                    window.location.href = '/admin';
                }, 500);
            });
        }
    });
</script>
