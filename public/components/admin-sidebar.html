    <!-- Navigation -->

            <span class="material-symbols-outlined text-[22px]">category</span>

        <button id="admin-logout" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-red-500 hover:bg-red-50 transition-colors">
            <span class="material-symbols-outlined text-[22px]">logout</span>
            <span class="font-medium">Logout</span>
        </button>
    </div>
</aside>

<!-- Admin sidebar JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Highlight current page in sidebar
        const currentPath = window.location.pathname + window.location.search;
        const sidebarLinks = document.querySelectorAll('.admin-sidebar a');
        sidebarLinks.forEach(link => {
            if (currentPath.includes(link.getAttribute('href'))) {
                link.classList.add('bg-[#e7eeff]', 'text-[#003fb1]');
                link.classList.remove('text-[#434654]');
            }
        });

        // Logout
        const logoutBtn = document.getElementById('admin-logout');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem('adminToken');
                window.location.href = '/admin';
            });
        }
    });
</script>
